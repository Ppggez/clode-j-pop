# web = nginx หน้าบ้าน (port 8080) ส่งต่อไปที่ api (port 3000) ใช้ MongoDB ตัวเดียว
# ขึ้น: docker compose up -d --build   ลง: docker compose down

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # เช็คผ่าน nginx เอง (localhost ใน container นี้คือ nginx ไม่ใช่ api)
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm run dev"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SERVER_NAME: api
      MONGO_URI: mongodb://mongo:27017/mydb
      # Windows mount เข้า container แล้ว nodemon จับการแก้ไฟล์ไม่ได้ ต้องใช้ polling
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/usr/src/app
      # กันไม่ให้ node_modules ของเครื่องเราไปทับของใน container
      - /usr/src/app/node_modules
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
